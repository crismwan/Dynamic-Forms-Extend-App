KitPrepare_aboutFieldSet_title=À propos
KitPrepare_aboutRichText_value=<span style="color:#374151;font-size:13px">Write a personal note for the welcome page and confirm the access list before the start date. Baseline items come from the enterprise kit; department and team items from those owners; recommendations come from what peers in the same organization and job profile hold (counts only, never names). Untick an item only with a reason (the fulfiller sees it). Elevated items need a reason and get an extra approval. OK sends every access request to its fulfiller group. Workday roles go through Workday's own role assignment; the kit only tracks them.</span>
