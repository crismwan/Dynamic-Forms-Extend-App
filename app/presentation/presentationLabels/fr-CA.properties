KitPeers_aboutFieldSet_title=À propos
KitPeers_aboutRichText_value=<span style="color:#374151;font-size:13px">Builds the access snapshot the manager's prepare task reads: for each organization and job profile with at least the minimum peers (else the organization and the ones below it), how many peers hold each kit access item, from the kit's own history of completed requests. Only counts are stored, never who holds what. Items held by only one or two of six or more peers are listed for IT as possible over-provisioning, not recommended. OK writes today's snapshot.</span>
